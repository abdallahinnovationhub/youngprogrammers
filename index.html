<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Ultimate 3D Bus Simulator</title>

<style>
* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

body {
    overflow:hidden;
    background:#080d14;
    font-family:Arial,sans-serif;
    color:white;
}

#game {
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}

canvas {
    display:block;
}

.screen {
    position:absolute;
    inset:0;
    display:none;
}

.screen.active {
    display:block;
}

button {
    border:none;
    cursor:pointer;
    font-weight:bold;
    color:white;
}

/* GARAGE */

#garage {
    background:linear-gradient(130deg,#101c2d,#35495c);
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

#garage.active {
    display:flex;
}

h1 {
    color:#ffc94a;
    text-align:center;
    margin:15px;
    font-size:clamp(23px,4vw,42px);
}

.garage {
    width:85%;
    height:60%;
    background:linear-gradient(#25394d,#101820);
    border:3px solid #c99a3a;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:clamp(90px,15vw,160px);
}

.buttons {
    display:flex;
    gap:15px;
    margin-top:20px;
}

.main {
    background:#c38b25;
    padding:15px 30px;
    border-radius:8px;
    font-size:17px;
}

/* LEVELS */

#levels {
    background:#101d30;
    padding:25px;
    text-align:center;
}

.levels {
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    max-width:700px;
    margin:25px auto;
}

.level {
    background:#b58225;
    padding:20px 5px;
    border-radius:9px;
    font-size:18px;
}

.locked {
    background:#323b47;
    color:#888;
}

/* ENVIRONMENT */

#environment {
    background:linear-gradient(#23425c,#111c29);
    text-align:center;
    padding:25px;
}

.places {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin:30px;
}

.place {
    background:#243d52;
    border:2px solid #c99a3a;
    padding:25px;
    border-radius:12px;
    min-width:120px;
}

/* GAME HUD */

#hud {
    position:absolute;
    inset:0;
    pointer-events:none;
    display:none;
}

#hud.active {
    display:block;
}

.top {
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
    gap:5px;
}

.info {
    background:#101820dc;
    border:1px solid #d4a13c;
    padding:9px 12px;
    border-radius:7px;
    font-size:clamp(10px,1.5vw,16px);
}

/* GEAR */

#gear {
    position:absolute;
    right:15px;
    top:65px;
    display:flex;
    flex-direction:column;
    gap:5px;
    pointer-events:auto;
}

.gear {
    background:#172331ed;
    border:2px solid #8495a6;
    padding:9px 16px;
    border-radius:6px;
}

.gear.selected {
    background:#c58b24;
    border-color:white;
}

/* CONTROLS */

#controls {
    position:absolute;
    bottom:12px;
    left:0;
    right:0;
    display:flex;
    justify-content:space-between;
    align-items:end;
    padding:0 12px;
    pointer-events:none;
}

.group {
    display:flex;
    align-items:end;
    gap:8px;
    pointer-events:auto;
}

.ctrl {
    width:clamp(48px,7vw,76px);
    height:clamp(48px,7vw,76px);
    background:#162536eF;
    border:2px solid #d0d9e0;
    border-radius:50%;
    font-size:clamp(10px,1.5vw,15px);
}

.pedal {
    width:clamp(53px,7vw,75px);
    height:85px;
    background:#286447;
    border-radius:12px;
}

#brake {
    background:#a52c2c;
}

#steering {
    width:90px;
    height:90px;
    font-size:30px;
}

#status {
    position:absolute;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#101820e8;
    padding:13px 22px;
    border-radius:9px;
    display:none;
    text-align:center;
    white-space:nowrap;
    z-index:5;
}

#board {
    position:absolute;
    top:65px;
    left:10px;
    pointer-events:auto;
    background:#126044;
    padding:12px;
    border-radius:8px;
}

#pause {
    position:absolute;
    top:65px;
    left:145px;
    pointer-events:auto;
    padding:12px;
    background:#172331;
    border-radius:7px;
}

#rotate {
    position:absolute;
    inset:0;
    z-index:100;
    display:none;
    background:#080d14;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:24px;
}

@media(orientation:portrait) {
    #rotate {
        display:flex;
    }
}

</style>
</head>

<body>

<div id="rotate">
    Please rotate your phone horizontally.
</div>

<div id="game">

<!-- GARAGE -->

<div id="garage" class="screen active">

<h1>ULTIMATE 3D BUS SIMULATOR</h1>

<div class="garage">
    🚌
</div>

<h2>YOUR BUS GARAGE</h2>

<div class="buttons">
    <button class="main" onclick="openLevels()">MISSIONS</button>
    <button class="main" onclick="openLevels()">PLAY</button>
</div>

</div>

<!-- LEVELS -->

<div id="levels" class="screen">

<h1>SELECT LEVEL</h1>

<div class="levels" id="levelList"></div>

<button class="main" onclick="screen('garage')">BACK</button>

</div>

<!-- ENVIRONMENT -->

<div id="environment" class="screen">

<h1>SELECT YOUR ROUTE</h1>

<div class="places">

<button class="place" onclick="start('City')">🏙️<br>CITY</button>

<button class="place" onclick="start('Desert')">🏜️<br>DESERT</button>

<button class="place" onclick="start('Village')">🏡<br>VILLAGE</button>

<button class="place" onclick="start('Highway')">🛣️<br>HIGHWAY</button>

<button class="place" onclick="start('Mountain')">⛰️<br>MOUNTAIN</button>

</div>

<button class="main" onclick="openLevels()">BACK</button>

</div>

<!-- DRIVING -->

<div id="hud">

<div class="top">

<div class="info">
🚌 ULTIMATE BUS
<br><span id="location">CITY</span>
</div>

<div class="info">
SPEED: <span id="speed">0</span> KM/H
</div>

<div class="info">
💰 ₦<span id="money">0</span>
</div>

</div>

<button id="board" onclick="boardPassenger()">
👤 PICK UP
</button>

<button id="pause" onclick="togglePause()">Ⅱ</button>

<div id="gear">

<button class="gear" onclick="setGear('P')">P - PARK</button>
<button class="gear" onclick="setGear('R')">R - REVERSE</button>
<button class="gear" onclick="setGear('N')">N - NEUTRAL</button>
<button class="gear selected" onclick="setGear('D')">D - DRIVE</button>

</div>

<div id="status"></div>

<div id="controls">

<div class="group">

<button class="ctrl" id="left">◀</button>
<button class="ctrl" id="right">▶</button>
<button class="ctrl" onclick="changeCamera()">CAM</button>

</div>

<div class="group">

<button class="ctrl pedal" id="brake">BRAKE</button>
<button class="ctrl pedal" id="accelerator">ACCEL</button>

</div>

</div>

</div>

</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* GAME DATA */

let money=0;
let currentLevel=1;
let unlocked=1;
let passengers=0;
let gear='D';
let speed=0;
let paused=false;
let cameraMode=0;
let steering=0;
let accelerate=false;
let braking=false;
let worldType='City';
let bus;
let wheels=[];
let people=[];
let road;
let renderer,scene,camera;
let moving=false;

/* NAVIGATION */

window.screen=function(id){

document.querySelectorAll('.screen')
.forEach(s=>s.classList.remove('active'));

document.getElementById('hud').classList.remove('active');

document.getElementById(id).classList.add('active');

};

window.openLevels=function(){

screen('levels');

let list=document.getElementById('levelList');

list.innerHTML='';

for(let i=1;i<=30;i++){

let b=document.createElement('button');

b.className='level '+(i<=unlocked?'':'locked');

b.innerText=i<=unlocked?'LEVEL '+i:'🔒 '+i;

b.onclick=()=>{

if(i<=unlocked){

currentLevel=i;

screen('environment');

}

};

list.appendChild(b);

}

};

window.setGear=function(g){

if(Math.abs(speed)>3){

notify('STOP BEFORE CHANGING GEAR');

return;

}

gear=g;

document.querySelectorAll('.gear')
.forEach(b=>b.classList.remove('selected'));

[...document.querySelectorAll('.gear')]
.find(b=>b.innerText.startsWith(g))
.classList.add('selected');

notify('GEAR: '+g);

};

function notify(msg){

let s=document.getElementById('status');

s.innerText=msg;

s.style.display='block';

setTimeout(()=>s.style.display='none',2200);

}

/* THREE JS */

function init3D(){

scene=new THREE.Scene();

scene.background=new THREE.Color(0x8bc4e8);

scene.fog=new THREE.Fog(0x8bc4e8,35,180);

camera=new THREE.PerspectiveCamera(
65,
innerWidth/innerHeight,
0.1,
500
);

renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:'high-performance'
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;

document.getElementById('game').appendChild(renderer.domElement);

let ambient=new THREE.HemisphereLight(0xffffff,0x52606c,2);

scene.add(ambient);

let sun=new THREE.DirectionalLight(0xffffff,3);

sun.position.set(-20,35,20);

sun.castShadow=true;

sun.shadow.mapSize.set(2048,2048);

scene.add(sun);

createBus();

createRoad();

createEnvironment();

animate();

}

/* MATERIALS */

function material(color,roughness=.75){

return new THREE.MeshStandardMaterial({
color,
roughness
});

}

/* BUS MODEL */

function createBus(){

bus=new THREE.Group();

let yellow=material(0xe6ad22);

let glass=material(0x17394e,.2);

let black=material(0x15191d);

let white=material(0xe5e8e8);

let body=new THREE.Mesh(
new THREE.BoxGeometry(2.8,1.6,6),
yellow
);

body.position.y=1.65;

body.castShadow=true;

bus.add(body);

/* Roof */

let roof=new THREE.Mesh(
new THREE.BoxGeometry(2.7,.2,5.8),
white
);

roof.position.y=2.55;

bus.add(roof);

/* Windows */

for(let side of [-1,1]){

for(let z=-2.3;z<=2.3;z+=1.1){

let win=new THREE.Mesh(
new THREE.BoxGeometry(.04,.8,.85),
glass
);

win.position.set(side*1.41,2.05,z);

bus.add(win);

}

}

/* Windshield */

let windshield=new THREE.Mesh(
new THREE.BoxGeometry(2.4,.8,.04),
glass
);

windshield.position.set(0,2.05,-3.01);

bus.add(windshield);

/* Wheels */

for(let x of [-1.45,1.45]){

for(let z of [-2,2]){

let wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.48,.48,.25,32),
black
);

wheel.rotation.z=Math.PI/2;

wheel.position.set(x,.55,z);

wheel.castShadow=true;

bus.add(wheel);

wheels.push(wheel);

}

}

/* Headlights */

for(let x of [-.95,.95]){

let light=new THREE.Mesh(
new THREE.BoxGeometry(.4,.25,.08),
material(0xffffff,.2)
);

light.position.set(x,1.45,-3.04);

bus.add(light);

}

scene.add(bus);

bus.position.set(0,0,0);

}

/* ROAD */

function createRoad(){

let grass=new THREE.Mesh(
new THREE.PlaneGeometry(300,300),
material(worldType==='Desert'?0xc8a16b:0x467b42)
);

grass.rotation.x=-Math.PI/2;

grass.position.y=-.05;

scene.add(grass);

road=new THREE.Group();

let asphalt=new THREE.Mesh(
new THREE.PlaneGeometry(14,300),
material(0x303338)
);

asphalt.rotation.x=-Math.PI/2;

asphalt.position.y=.01;

road.add(asphalt);

/* Road lines */

for(let z=-145;z<150;z+=12){

let line=new THREE.Mesh(
new THREE.BoxGeometry(.15,.03,5),
material(0xffffff)
);

line.position.set(0,.05,z);

road.add(line);

}

scene.add(road);

}

/* BUILDINGS */

function createEnvironment(){

for(let i=0;i<35;i++){

let height=5+Math.random()*15;

let building=new THREE.Mesh(
new THREE.BoxGeometry(5,height,6),
material([
0x9babb8,
0x9d8069,
0x758a9c,
0xc0b6a1
][i%4])
);

building.position.set(
i%2===0?-13:13,
height/2,
-i*10-15
);

building.castShadow=true;

scene.add(building);

}

/* Trees */

for(let i=0;i<40;i++){

let tree=new THREE.Group();

let trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.2,.3,2,8),
material(0x654127)
);

trunk.position.y=1;

tree.add(trunk);

let leaves=new THREE.Mesh(
new THREE.SphereGeometry(1.5,12,12),
material(0x24783b)
);

leaves.position.y=3;

tree.add(leaves);

tree.position.set(
i%2===0?-20:20,
0,
-i*9
);

scene.add(tree);

}

/* HUMAN PASSENGERS */

for(let i=0;i<8;i++){

let person=createHuman();

person.position.set(
Math.random()*12-6,
0,
-15-i*8
);

scene.add(person);

people.push(person);

}

}

/* 3D HUMAN CHARACTER */

function createHuman(){

let human=new THREE.Group();

let skin=material(0x9b6849);

let shirt=material(0x2875a7);

let trousers=material(0x252b39);

let head=new THREE.Mesh(
new THREE.SphereGeometry(.23,20,20),
skin
);

head.position.y=1.65;

human.add(head);

let body=new THREE.Mesh(
new THREE.CapsuleGeometry(.28,.65,6,12),
shirt
);

body.position.y=1.05;

human.add(body);

for(let x of [-.14,.14]){

let leg=new THREE.Mesh(
new THREE.CapsuleGeometry(.12,.65,4,8),
trousers
);

leg.position.set(x,.38,0);

human.add(leg);

let arm=new THREE.Mesh(
new THREE.CapsuleGeometry(.09,.55,4,8),
skin
);

arm.position.set(x*2,1.1,0);

arm.rotation.z=x>0?-.2:.2;

human.add(arm);

}

return human;

}

/* GAME START */

window.start=function(place){

worldType=place;

document.getElementById('location').innerText=place.toUpperCase();

screen('environment');

document.getElementById('environment').classList.remove('active');

document.getElementById('hud').classList.add('active');

speed=0;
passengers=0;
gear='D';
paused=false;

notify('WELCOME. FIND YOUR PASSENGERS.');

};

/* CONTROLS */

function hold(id,callback){

let el=document.getElementById(id);

el.addEventListener('pointerdown',e=>{

e.preventDefault();

callback(true);

});

['pointerup','pointerleave','pointercancel']
.forEach(event=>el.addEventListener(event,()=>callback(false)));

}

hold('accelerator',v=>accelerate=v);

hold('brake',v=>braking=v);

hold('left',v=>steering=v?-1:0);

hold('right',v=>steering=v?1:0);

/* CAMERA */

window.changeCamera=function(){

cameraMode=(cameraMode+1)%3;

notify(
cameraMode===0?'OUTSIDE VIEW':
cameraMode===1?'SIDE VIEW':
'TOP VIEW'
);

};

/* PASSENGERS */

window.boardPassenger=function(){

if(Math.abs(speed)>2){

notify('STOP THE BUS FIRST');

return;

}

if(gear!=='P'){

notify('SELECT PARK BEFORE PICKUP');

return;

}

if(passengers>=20){

notify('BUS IS FULL');

return;

}

passengers++;

notify('PASSENGER BOARDED');

if(passengers===1){

setTimeout(()=>{

notify('DRIVE TO YOUR DESTINATION');

},1000);

}

};

/* PAUSE */

window.togglePause=function(){

paused=!paused;

notify(paused?'PAUSED':'RESUMED');

};

/* UPDATE */

function update(){

if(paused)return;

if(gear==='D' && accelerate){

speed+=.025;

}

if(gear==='R' && accelerate){

speed-=.02;

}

if(braking){

speed*=.94;

}

if(gear==='P'||gear==='N'){

speed*=.97;

}

speed=Math.max(-.5,Math.min(speed,.65));

bus.position.z-=speed;

bus.position.x+=steering*.06;

bus.position.x=Math.max(-4,Math.min(4,bus.position.x));

bus.rotation.y=steering*.08;

wheels.forEach(w=>{

w.rotation.x+=speed;

});

document.getElementById('speed').innerText=
Math.round(Math.abs(speed)*160);

document.getElementById('money').innerText=money;

}

/* CAMERA FOLLOW */

function updateCamera(){

if(cameraMode===0){

camera.position.set(
bus.position.x+5,
7,
bus.position.z+11
);

camera.lookAt(
bus.position.x,
1.5,
bus.position.z-5
);

}

else if(cameraMode===1){

camera.position.set(
bus.position.x+11,
4,
bus.position.z+1
);

camera.lookAt(bus.position);

}

else{

camera.position.set(
bus.position.x,
22,
bus.position.z+2
);

camera.lookAt(bus.position);

}

}

/* RENDER */

function animate(){

requestAnimationFrame(animate);

if(bus && document.getElementById('hud').classList.contains('active')){

update();

updateCamera();

}

renderer.render(scene,camera);

}

window.addEventListener('resize',()=>{

camera.aspect=innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);

});

/* INITIALIZE */

init3D();

</script>

</body>
</html>
