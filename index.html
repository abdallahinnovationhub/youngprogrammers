<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ultimate Bus Simulator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#game {
    width: 100%;
    height: 100dvh;
    position: relative;
    overflow: hidden;
}

#world {
    position: absolute;
    inset: 0;
}

canvas {
    display: block;
}

/* TOP INFORMATION */
#hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    z-index: 10;
    pointer-events: none;
}

.info {
    background: rgba(0,0,0,.78);
    color: white;
    padding: 9px 13px;
    border-radius: 9px;
    font-size: clamp(11px, 2vw, 15px);
    border: 1px solid #82909b;
}

/* DRIVING CONTROLS */
#controls {
    position: absolute;

    /* Controls are raised above the bottom of the screen */
    top: 57%;
    bottom: auto;
    transform: translateY(-50%);

    left: 0;
    right: 0;
    padding: 0 14px;

    display: none;
    justify-content: space-between;
    align-items: center;

    z-index: 30;
    pointer-events: none;
}

.control-group {
    display: flex;
    align-items: center;
    gap: clamp(5px, 1.5vw, 13px);
    pointer-events: auto;
}

button {
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
}

.drive-btn {
    width: clamp(52px, 10vw, 76px);
    height: clamp(52px, 10vw, 76px);
    border-radius: 50%;
    border: 3px solid white;
    background: rgba(17, 43, 65, .94);
    color: white;
    font-weight: bold;
    font-size: clamp(11px, 2vw, 16px);
    box-shadow: 0 4px 10px #000;
}

.drive-btn:active {
    background: #168cdb;
    transform: scale(.94);
}

.pedal {
    width: clamp(55px, 10vw, 78px);
    height: clamp(75px, 15vw, 105px);
    border-radius: 13px;
    border: 3px solid white;
    color: white;
    font-weight: bold;
    background: rgba(20, 55, 76, .95);
    box-shadow: 0 4px 10px #000;
}

#accelerator {
    background: rgba(0, 125, 70, .95);
}

#brake {
    background: rgba(170, 35, 35, .95);
}

/* GEAR AND CAMERA BUTTONS */
#topButtons {
    position: absolute;
    top: 62px;
    right: 12px;
    display: none;
    gap: 7px;
    z-index: 40;
}

.small-btn {
    background: #142638;
    color: white;
    border: 2px solid white;
    border-radius: 8px;
    padding: 10px 12px;
    font-weight: bold;
    font-size: 12px;
}

#gearBox {
    position: absolute;
    top: 62px;
    left: 12px;
    display: none;
    gap: 5px;
    z-index: 40;
}

.gear-btn {
    width: 39px;
    height: 39px;
    border-radius: 7px;
    border: 2px solid white;
    color: white;
    background: #25394b;
    font-weight: bold;
}

.gear-btn.active {
    background: #e49b19;
    color: black;
}

/* PICKUP BUTTON */
#pickup {
    position: absolute;
    left: 50%;
    top: 43%;
    transform: translate(-50%, -50%);
    display: none;
    background: #e99c18;
    color: black;
    padding: 14px 22px;
    border: 3px solid white;
    border-radius: 12px;
    font-weight: bold;
    font-size: 15px;
    z-index: 50;
}

/* GARAGE */
#garage {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #071a2d, #123d59, #07131e);
    color: white;
    text-align: center;
    padding: 15px;
}

.panel {
    width: min(520px, 95%);
    max-height: 92%;
    overflow-y: auto;
    background: rgba(0,0,0,.72);
    border: 2px solid #d69b36;
    border-radius: 18px;
    padding: 20px;
}

.panel h1 {
    color: #f6c65d;
    margin-bottom: 7px;
    font-size: clamp(23px, 5vw, 35px);
}

.panel p {
    color: #ddd;
    margin: 8px 0 15px;
}

.destination {
    width: 100%;
    padding: 13px;
    margin: 5px 0;
    border-radius: 9px;
    border: 2px solid #8c9aa6;
    background: #193a52;
    color: white;
    font-weight: bold;
    font-size: 15px;
}

.destination.selected {
    background: #b17a18;
    border-color: white;
    color: black;
}

#startButton {
    width: 100%;
    padding: 15px;
    background: #e6a72e;
    border: none;
    border-radius: 10px;
    margin-top: 12px;
    font-size: 18px;
    font-weight: bold;
    color: black;
}

#missionText {
    color: #ffdc8b;
    font-weight: bold;
    margin: 8px;
}

#message {
    position: absolute;
    left: 50%;
    top: 24%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.85);
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    display: none;
    z-index: 60;
    text-align: center;
    max-width: 85%;
}

@media (orientation: portrait) {
    #game::after {
        content: "ROTATE YOUR PHONE TO LANDSCAPE";
        position: absolute;
        inset: 0;
        z-index: 200;
        background: #071a2d;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        padding: 25px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="world"></div>

    <div id="hud">
        <div class="info">💰 ₦<span id="money">0</span></div>
        <div class="info">MISSION <span id="level">1</span></div>
        <div class="info">SPEED <span id="speed">0</span> km/h</div>
        <div class="info">PASSENGERS <span id="passengers">0</span></div>
    </div>

    <div id="gearBox">
        <button class="gear-btn active" onclick="changeGear('P')">P</button>
        <button class="gear-btn" onclick="changeGear('R')">R</button>
        <button class="gear-btn" onclick="changeGear('N')">N</button>
        <button class="gear-btn" onclick="changeGear('D')">D</button>
    </div>

    <div id="topButtons">
        <button class="small-btn" onclick="changeCamera()">CAMERA</button>
        <button class="small-btn" onclick="pauseGame()">PAUSE</button>
    </div>

    <div id="controls">

        <div class="control-group">
            <button class="drive-btn" id="left">◀</button>
            <button class="drive-btn" id="right">▶</button>
        </div>

        <div class="control-group">
            <button class="drive-btn" id="brake">BRAKE</button>
            <button class="drive-btn" id="accelerator">DRIVE</button>
        </div>

    </div>

    <button id="pickup" onclick="collectPassengers()">
        PICK UP PASSENGERS
    </button>

    <div id="message"></div>

    <div id="garage">
        <div class="panel">
            <h1>ULTIMATE BUS SIMULATOR</h1>
            <p>Welcome to your bus driving career.</p>

            <h3>SELECT YOUR DESTINATION</h3>

            <button class="destination selected" onclick="selectDestination('City', this)">
                🏙️ CITY ROUTE
            </button>

            <button class="destination" onclick="selectDestination('Desert', this)">
                🏜️ DESERT ROUTE
            </button>

            <button class="destination" onclick="selectDestination('Village', this)">
                🌳 VILLAGE ROUTE
            </button>

            <button class="destination" onclick="selectDestination('Highway', this)">
                🛣️ HIGHWAY ROUTE
            </button>

            <div id="missionText">MISSION 1: Collect passengers.</div>

            <button id="startButton" onclick="startGame()">
                START DRIVING
            </button>
        </div>
    </div>

</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const world = document.getElementById("world");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ac7ec);
scene.fog = new THREE.Fog(0x8ac7ec, 80, 400);

const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 7, 13);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
world.appendChild(renderer.domElement);

/* LIGHTING */

scene.add(new THREE.HemisphereLight(0xffffff, 0x536b45, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2);
sunlight.position.set(-20, 40, 20);
sunlight.castShadow = true;
scene.add(sunlight);

/* MATERIALS */

function material(color, roughness=0.8) {
    return new THREE.MeshStandardMaterial({color, roughness});
}

const grassMat = material(0x478b40);
const roadMat = material(0x303438);
const whiteMat = material(0xffffff);
const busMat = material(0xd51d1d);
const glassMat = new THREE.MeshStandardMaterial({
    color:0x8bd4e9,
    roughness:0.2,
    metalness:0.2
});

/* WORLD */

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    grassMat
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.15;
ground.receiveShadow = true;
scene.add(ground);

const road = new THREE.Mesh(
    new THREE.PlaneGeometry(14, 500),
    roadMat
);
road.rotation.x = -Math.PI/2;
road.position.y = 0;
scene.add(road);

for(let z=-240; z<250; z+=12) {
    const line = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.03, 5),
        whiteMat
    );
    line.position.set(0,0.04,z);
    scene.add(line);
}

/* BUS */

const bus = new THREE.Group();
scene.add(bus);

const body = new THREE.Mesh(
    new THREE.BoxGeometry(3.5, 3.2, 9),
    busMat
);
body.position.y = 2;
body.castShadow = true;
bus.add(body);

const roof = new THREE.Mesh(
    new THREE.BoxGeometry(3.55, 0.25, 9.05),
    material(0xeeeeee)
);
roof.position.y = 3.7;
bus.add(roof);

/* WINDOWS */

for(let z=-3.3; z<=3.3; z+=1.5) {
    for(const side of [-1,1]) {
        const windowMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.06, 1.2, 1.15),
            glassMat
        );
        windowMesh.position.set(side*1.77, 2.6, z);
        bus.add(windowMesh);
    }
}

const frontGlass = new THREE.Mesh(
    new THREE.BoxGeometry(2.8, 1.2, 0.06),
    glassMat
);
frontGlass.position.set(0, 2.65, -4.53);
bus.add(frontGlass);

/* WHEELS */

const wheels = [];

for(const x of [-1.8,1.8]) {
    for(const z of [-3,3]) {
        const wheel = new THREE.Mesh(
            new THREE.CylinderGeometry(0.65,0.65,0.35,24),
            material(0x171717)
        );
        wheel.rotation.z = Math.PI/2;
        wheel.position.set(x,0.7,z);
        bus.add(wheel);
        wheels.push(wheel);
    }
}

bus.position.set(0,0,0);

/* SCENERY */

function createBuilding(x,z,color) {
    const h = 5 + Math.random()*12;

    const building = new THREE.Mesh(
        new THREE.BoxGeometry(5,h,6),
        material(color)
    );

    building.position.set(x,h/2,z);
    scene.add(building);

    for(let y=2; y<h-1; y+=2.5) {
        for(let side=-1; side<=1; side+=2) {
            const w = new THREE.Mesh(
                new THREE.BoxGeometry(0.08,0.9,0.9),
                glassMat
            );
            w.position.set(x+side*2.52,y,z);
            scene.add(w);
        }
    }
}

function createTree(x,z) {
    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25,0.4,2.5,8),
        material(0x71421e)
    );
    trunk.position.set(x,1.25,z);
    scene.add(trunk);

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(1.7,10,10),
        material(0x207333)
    );
    leaves.position.set(x,3.3,z);
    scene.add(leaves);
}

for(let z=-230; z<240; z+=18) {
    createBuilding(-13,z,0x9aabb9);
    createBuilding(13,z,0xb9a38d);
}

for(let z=-220; z<240; z+=13) {
    createTree(-23,z);
    createTree(23,z+6);
}

/* PASSENGER MODELS */

const passengers = [];

function createPassenger(x,z) {
    const person = new THREE.Group();

    const shirtColors = [0x2455a4,0xb43c32,0x22804c,0x9b6a23];
    const shirtColor = shirtColors[
        Math.floor(Math.random()*shirtColors.length)
    ];

    const bodyPerson = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3,0.38,1.1,10),
        material(shirtColor)
    );
    bodyPerson.position.y = 1.15;
    person.add(bodyPerson);

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.28,14,14),
        material(0x9b633f)
    );
    head.position.y = 1.9;
    person.add(head);

    const legMaterial = material(0x252b36);

    for(const side of [-1,1]) {
        const leg = new THREE.Mesh(
            new THREE.CylinderGeometry(0.11,0.12,0.8,8),
            legMaterial
        );
        leg.position.set(side*0.16,0.4,0);
        person.add(leg);
    }

    person.position.set(x,0,z);
    scene.add(person);
    passengers.push(person);
}

for(let i=0;i<5;i++) {
    createPassenger(-5, -28-i*1.3);
    createPassenger(5, -28-i*1.3);
}

/* GAME STATE */

let destination = "City";
let gear = "P";
let speed = 0;
let money = 0;
let passengerCount = 0;
let level = 1;
let cameraMode = 0;
let started = false;
let paused = false;
let steering = 0;
let accelerator = false;
let braking = false;
let collected = false;

const destinations = {
    City: {color:0x8ac7ec, drop:-150},
    Desert: {color:0xd7b46d, drop:-150},
    Village: {color:0x9bcf8d, drop:-150},
    Highway: {color:0x9bc5e5, drop:-150}
};

/* DESTINATION SELECTION */

window.selectDestination = function(name, button) {
    destination = name;

    document.querySelectorAll(".destination").forEach(b =>
        b.classList.remove("selected")
    );

    button.classList.add("selected");

    document.getElementById("missionText").textContent =
        "MISSION " + level + ": Collect passengers and reach the " + name + " destination.";
};

/* START GAME */

window.startGame = function() {
    document.getElementById("garage").style.display = "none";
    document.getElementById("controls").style.display = "flex";
    document.getElementById("gearBox").style.display = "flex";
    document.getElementById("topButtons").style.display = "flex";

    bus.position.set(0,0,0);
    speed = 0;
    gear = "P";
    passengerCount = 0;
    collected = false;
    started = true;
    paused = false;

    showMessage("Welcome! Collect passengers at the bus stop.");
    updateUI();
};

/* GEAR */

window.changeGear = function(newGear) {
    if(!started) return;

    gear = newGear;

    document.querySelectorAll(".gear-btn").forEach(b => {
        b.classList.toggle("active", b.textContent === newGear);
    });

    if(newGear === "P") {
        speed = 0;
    }

    showMessage("Gear: " + newGear);
};

/* CAMERA */

window.changeCamera = function() {
    cameraMode = (cameraMode + 1) % 3;

    const names = ["Outside view","Side view","Top view"];
    showMessage(names[cameraMode]);
};

/* PAUSE */

window.pauseGame = function() {
    paused = !paused;
    showMessage(paused ? "GAME PAUSED" : "GAME RESUMED");
};

/* MESSAGE */

let messageTimer;

function showMessage(text) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.style.display = "block";

    clearTimeout(messageTimer);

    messageTimer = setTimeout(() => {
        box.style.display = "none";
    },2500);
}

/* PASSENGERS */

window.collectPassengers = function() {
    if(!started || collected) return;

    if(speed > 2) {
        showMessage("Stop the bus before collecting passengers!");
        return;
    }

    if(gear !== "P") {
        showMessage("Put the bus in PARK first!");
        return;
    }

    collected = true;
    passengerCount = 5;

    passengers.forEach(p => p.visible = false);

    document.getElementById("pickup").style.display = "none";

    showMessage("5 passengers boarded! Drive to your destination.");
    updateUI();
}

/* INPUTS */

function holdButton(id, down, up) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", e => {
        e.preventDefault();
        down();
    });

    ["pointerup","pointercancel","pointerleave"].forEach(event => {
        button.addEventListener(event, e => {
            e.preventDefault();
            up();
        });
    });
}

holdButton("accelerator",
    () => accelerator=true,
    () => accelerator=false
);

holdButton("brake",
    () => braking=true,
    () => braking=false
);

holdButton("left",
    () => steering=-1,
    () => {if(steering===-1) steering=0;}
);

holdButton("right",
    () => steering=1,
    () => {if(steering===1) steering=0;}
);

/* KEYBOARD SUPPORT */

window.addEventListener("keydown", e => {
    if(e.key==="ArrowUp" || e.key==="w") accelerator=true;
    if(e.key==="ArrowDown" || e.key==="s") braking=true;
    if(e.key==="ArrowLeft" || e.key==="a") steering=-1;
    if(e.key==="ArrowRight" || e.key==="d") steering=1;
});

window.addEventListener("keyup", e => {
    if(e.key==="ArrowUp" || e.key==="w") accelerator=false;
    if(e.key==="ArrowDown" || e.key==="s") braking=false;
    if(["ArrowLeft","ArrowRight","a","d"].includes(e.key)) steering=0;
});

/* UI */

function updateUI() {
    document.getElementById("money").textContent = money;
    document.getElementById("level").textContent = level;
    document.getElementById("speed").textContent = Math.round(speed*12);
    document.getElementById("passengers").textContent = passengerCount;
}

/* GAME LOOP */

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(),0.04);

    if(started && !paused) {

        if(gear==="D" && accelerator) {
            speed = Math.min(speed + delta*3, 12);
        }

        if(gear==="R" && accelerator) {
            speed = Math.min(speed + delta*2, 5);
        }

        if(braking) {
            speed = Math.max(0,speed-delta*9);
        }

        if(!accelerator && !braking) {
            speed = Math.max(0,speed-delta*0.7);
        }

        let direction = gear==="R" ? 1 : -1;

        if(gear==="D" || gear==="R") {
            bus.position.z += speed*delta*direction;
        }

        bus.position.x += steering*speed*delta*0.22;

        bus.position.x = THREE.MathUtils.clamp(
            bus.position.x,-4.5,4.5
        );

        bus.rotation.y = THREE.MathUtils.lerp(
            bus.rotation.y,
            -steering*0.12,
            delta*4
        );

        wheels.forEach(w => {
            w.rotation.x += speed*delta;
        });

        /* PASSENGER STOP */

        const stopDistance = Math.abs(bus.position.z + 28);

        if(!collected && stopDistance < 7) {
            document.getElementById("pickup").style.display = "block";
        } else {
            document.getElementById("pickup").style.display = "none";
        }

        /* DESTINATION */

        if(collected && bus.position.z < -145 && !paused) {
            if(speed < 1 && gear==="P") {
                completeMission();
            }
        }
    }

    /* CAMERA VIEWS */

    if(cameraMode===0) {
        camera.position.lerp(
            new THREE.Vector3(
                bus.position.x,
                bus.position.y+7,
                bus.position.z+13
            ),0.08
        );
        camera.lookAt(bus.position.x,bus.position.y+1,bus.position.z-5);

    } else if(cameraMode===1) {
        camera.position.lerp(
            new THREE.Vector3(
                bus.position.x+12,
                bus.position.y+5,
                bus.position.z+2
            ),0.08
        );
        camera.lookAt(bus.position);

    } else {
        camera.position.lerp(
            new THREE.Vector3(
                bus.position.x,
                bus.position.y+25,
                bus.position.z+1
            ),0.08
        );
        camera.lookAt(bus.position);
    }

    updateUI();
    renderer.render(scene,camera);
}

animate();

/* COMPLETE MISSION */

function completeMission() {
    started = false;
    speed = 0;

    money += 5000;
    passengerCount = 0;

    document.getElementById("controls").style.display = "none";
    document.getElementById("gearBox").style.display = "none";
    document.getElementById("topButtons").style.display = "none";

    level++;

    document.querySelector("#garage h1").textContent = "MISSION COMPLETED!";
    document.getElementById("missionText").textContent =
        "You earned ₦5,000. Your next mission is Level " + level + ".";

    document.getElementById("startButton").textContent =
        "START NEXT LEVEL";

    document.getElementById("garage").style.display = "flex";

    updateUI();
}

/* RESIZE */

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
